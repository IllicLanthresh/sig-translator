[project]
name = "sig-translator"
version = "0.1.6"
description = "Star Citizen mining/salvage signature -> material overlay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10.0",
    "keyboard>=0.13",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
sig-translator = "sigtranslator.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sigtranslator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
